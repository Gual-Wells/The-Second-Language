<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#315c7c"><title>第二语言 · 认证与纪念币试验</title><link rel="stylesheet" href="styles.css?v=1"></head><body>
<header><a href="/" class="return">‹ 第二语言</a><small>CHAPTER COLLECTION</small><h1>认证与纪念币</h1><p>功能试验 · 不授予正式章节认证</p></header>
<nav class="tabs" aria-label="测试内容"><button data-tab="test" aria-selected="true">章节认证</button><button data-tab="plaza" aria-selected="false">祭坛广场</button><button data-tab="jar" aria-selected="false">玻璃罐</button></nav>
<main><section id="login" hidden class="card"><h2>请先登录</h2><p>在第二语言登录后，返回这里继续测试。</p><a class="primary" href="/">前往第二语言</a></section>
<section id="testPanel"><div class="card intro"><small>第 3 章 · 水回来的地方</small><h2>理解认证试验</h2><p>八道题，约十分钟。每次重新申请独立随机组卷，满分通过，可以反复重测。</p><div class="row"><button id="newTest" class="primary">申请测试</button><a href="/?chapter=2026-10-09" target="_blank" rel="noopener">阅读原章 ›</a></div><p class="muted">这里先比较原创样题的理解难度、随机重测和通过流程。</p></div>
<div id="paper" hidden><div id="paperHead" class="band"></div><form id="answerForm"></form><button id="submitTest" class="primary wide">提交答卷</button><div id="result" class="card" hidden></div></div><div id="history" class="card"></div></section>
<section id="scenePanel" hidden><div class="scene-frame"><div id="scene" role="img" aria-label="主题纪念币三维场景"></div><div id="sceneStatus" class="scene-status" aria-live="polite">正在准备场景…</div></div><div id="coinCaption" class="coin-caption"><small>主题样币</small><h2>地图上的那条线</h2><p>左右拖动圆环，点按纪念币聆听。</p></div>
<div id="plazaControls" class="row scene-controls"><button id="prevCoin">‹ 上一枚</button><button id="playCoin" class="primary">聆听纪念音色</button><button id="nextCoin">下一枚 ›</button></div>
<div id="jarControls" hidden class="card"><div class="row"><label>示意币数量<select id="coinCount"><option value="32">32 枚</option><option value="128">128 枚</option><option value="500">500 枚</option></select></label><button id="motion" class="primary">启用摇晃与声音</button></div><div class="row"><button id="shake">轻摇</button><button id="strongShake">重摇</button><label class="sound"><input id="sound" type="checkbox" checked>碰撞声音</label></div><p class="muted">也可拖动罐子。手机摇晃需系统授权；这些币用于体验与数量测试。</p></div></section>
<section class="card feedback"><h2>测试感受</h2><div id="ratings"></div><textarea id="feedbackNote" rows="3" placeholder="例如：题目是否真正考查理解、声音是否刺耳、摇晃是否自然…" aria-label="反馈说明"></textarea><div class="row"><button id="sendFeedback" class="primary">提交反馈</button><button id="exportFeedback">导出备份</button></div><p class="muted">填写时自动保存在本机。</p></section>
</main><div id="toast" role="status" aria-live="polite"></div><script type="module" src="app.js?v=1"></script></body></html>
