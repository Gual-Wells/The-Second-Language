<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#19201c">
  <title>卷轴拟音 · 对照试听</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="study">
    <header class="heading">
      <div><p class="eyebrow">声音研究样品</p><h1>卷轴拟音对照</h1></div>
      <a href="./CREDITS.md" target="_blank" rel="noopener">查看来源 <span aria-hidden="true">↗</span></a>
    </header>

    <section class="variants" aria-label="选择声音候选">
      <button type="button" class="variant" data-variant="A" aria-pressed="true"><span>A</span><strong>厚纸地图</strong></button>
      <button type="button" class="variant" data-variant="B" aria-pressed="false"><span>B</span><strong>重纸录音</strong></button>
      <button type="button" class="variant" data-variant="v41" aria-pressed="false"><span>原</span><strong>v41</strong></button>
    </section>

    <section id="stage" class="stage" aria-label="项目纪念卷轴，轻触开合，上下拖动控制动作">
      <canvas id="mist" class="mist" aria-hidden="true"></canvas>
      <canvas id="scroll" class="scroll" tabindex="0" aria-label="项目纪念卷轴。轻触或按空格开合，上下拖动控制展开进度。"></canvas>
      <div id="loading" class="loading" role="status"><span class="loading-dot" aria-hidden="true"></span><span id="viewerStatus">正在准备原版卷轴…</span></div>
      <p class="gesture-hint">轻触开合 · 上下拖动</p>
    </section>

    <section class="controls" aria-label="试听操作">
      <button id="openScroll" type="button" disabled>开卷</button>
      <button id="closeScroll" type="button" disabled>合卷</button>
      <button id="unlockSound" class="primary" type="button">启用试听</button>
      <label class="music-option"><input id="withMusic" type="checkbox"><span>与音乐合听</span></label>
    </section>

    <footer class="notes">
      <div class="readiness"><p id="soundStatus" role="status" aria-live="polite">默认仅拟音，轻触“启用试听”开启声音。</p><button id="retry" type="button" hidden>重新准备</button></div>
      <p class="phase"><span>实际动作</span><output id="phase">等待载入</output><output id="progress">0%</output></p>
      <p class="listening-note">看画面听节奏与材质：扣针接触、皮革抽动与纸张展开是否贴合，是否有突兀或重复感。A、B 仅纸声不同，机构声共用；“原 v41”保留现有声音作对照。三者画面、皮扣机构与雾染相同。本页是候选试听，不代表质量验收。</p>
    </footer>
  </main>
  <noscript>此研究样品需要 JavaScript 与 WebGL。</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
