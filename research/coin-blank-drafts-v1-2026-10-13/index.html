<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第二语言｜币胚稿图</title><style>body{max-width:1120px;margin:0 auto;padding:24px 16px 60px;background:#f6f4ef;color:#263238;font:17px/1.65 Georgia,'Microsoft YaHei',serif}h1{font-size:30px;line-height:1.3}h2{font-size:24px;margin-top:32px}.muted{color:#66736c}nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button{padding:8px 20px;border:1px solid #aebdb6;border-radius:5px;background:#eef2ed;color:#273730;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#507266;color:white}img{display:block;width:100%;height:auto;border-radius:6px;border:1px solid #bdc8c1}a{color:#326858}.card{margin:20px 0 30px}.note{padding:15px 20px;background:#fffdfa;border:1px solid #d4ddd5;border-radius:5px}@media(max-width:600px){h1{font-size:25px}body{padding:16px 10px}}</style>
<h1>共用币胚 · 首轮完整稿图</h1><p class="muted">正面留白｜统一币背｜动态字段XXX占位 · AI制造设计稿</p><p class="note">固定系列名保留。没有加入龙或其他主题；本页展示稿图，真实三维模型随后制作。</p>
<nav aria-label="材质状态"><button data-phase="g" aria-pressed="true">白模</button><button data-phase="f" aria-pressed="false">银色材质</button></nav>
<section class="card"><h2>整币主视</h2><a id="mainLink" href="assets/g-master-v2.png" target="_blank"><img id="main" src="assets/g-master-v2.png" alt="整币正面、背面及两张斜视稿，点击查看原图"></a></section>
<section class="card"><h2>补充角度</h2><a id="anglesLink" href="assets/g-angles.png" target="_blank"><img id="angles" src="assets/g-angles.png" alt="整币左右、上方斜视与四向侧缘稿，点击查看原图"></a></section>
<section class="card"><h2>结构近景</h2><a href="assets/g-details.png" target="_blank"><img src="assets/g-details.png" alt="包边、侧缘、开卷及占位铭文的结构近景，每幅保留完整定位币"></a></section>
<p><a href="README.md">制作说明</a> · <a href="prompt-set.json">提示词与父本</a> · <a href="manifest.json">文件清单</a></p>
<script>function phase(p){document.querySelectorAll('[data-phase]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.phase===p?'true':'false'));for(const [id,file]of [['main',`${p}-master-v2.png`],['angles',`${p}-angles.png`]]){const src=`assets/${file}`;document.getElementById(id).src=src;document.getElementById(id+'Link').href=src;}}document.querySelectorAll('[data-phase]').forEach(b=>b.addEventListener('click',()=>phase(b.dataset.phase)));</script></html>
